# .github/workflows/03-version-tag.yml
name: Version and Tag Docker Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-tag-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build the JAR (same as Demo 1)
        run: mvn package --batch-mode

      - name: Extract version number from Git tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/myapp:${{ steps.version.outputs.VERSION }} .

      - name: Also tag as latest
        run: docker tag ghcr.io/${{ github.repository_owner }}/myapp:${{ steps.version.outputs.VERSION }} ghcr.io/${{ github.repository_owner }}/myapp:latest

      - name: Push version tag
        run: docker push ghcr.io/${{ github.repository_owner }}/myapp:${{ steps.version.outputs.VERSION }}

      - name: Push latest tag
        run: docker push ghcr.io/${{ github.repository_owner }}/myapp:latest